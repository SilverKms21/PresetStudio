[package]
name = "preset-studio"
version = "0.1.0"
edition = "2021"
description = "Preset Studio - Universal JSON preset manager & visual compositing editor (Rust/egui port)"

[dependencies]
eframe = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = "thin"
